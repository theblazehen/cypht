<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cypht Redesign - Compose</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg-base: #0d1117;
      --bg-surface: #131720;
      --bg-elevated: #161b22;
      --bg-hover: #1c2533;
      --border: #2a3343;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --accent-green: #3fb950;
      --accent-teal: #008080;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --radius-sm: 8px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top right, #131a26 0%, var(--bg-base) 36%);
      color: var(--text-primary);
      font-family: "Inter", sans-serif;
      line-height: 1.45;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: linear-gradient(180deg, #131923 0%, var(--bg-surface) 100%);
      border-right: 1px solid var(--border);
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #3b465d transparent;
    }

    .logo {
      font-weight: 700;
      letter-spacing: 0.2px;
      font-size: 24px;
      margin-bottom: var(--space-4);
    }

    .menu-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      margin-bottom: var(--space-4);
    }

    .menu-item, .folder-link {
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text-secondary);
      padding: 9px 10px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-2);
      text-decoration: none;
      cursor: pointer;
      transition: 120ms ease;
    }

    .menu-item:hover, .folder-link:hover {
      background: var(--bg-hover);
      border-color: #314059;
      color: var(--text-primary);
    }

    .menu-item.active {
      background: rgba(88, 166, 255, 0.12);
      border-color: rgba(88, 166, 255, 0.45);
      color: #d7ebff;
    }

    .menu-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .badge { background: #58a6ff; color: #fff; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; min-width: 24px; text-align: center; }
    .badge.muted { background: #1c2533; color: #8b949e; }

    .section-label {
      color: var(--text-secondary);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--space-2);
    }

    .account-block {
      margin-bottom: var(--space-2);
      border: 1px solid #243044;
      border-radius: var(--radius-sm);
      background: rgba(18, 26, 38, 0.72);
      padding: 10px;
    }

    .account-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-primary);
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #3fb950; }
    .dot.gray { background: #8b949e; }

    .account-folders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-1);
      margin-top: var(--space-2);
    }

    .folder-link {
      padding: 6px 8px;
      font-size: 13px;
    }

    .sidebar-footer {
      margin-top: auto;
      display: grid;
      gap: var(--space-2);
      padding-top: var(--space-4);
    }

    .footer-btn, .btn {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #111722;
      color: var(--text-primary);
      padding: 9px 12px;
      font: inherit;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: 120ms ease;
    }

    .footer-btn:hover, .btn:hover {
      background: #182030;
      border-color: #3a4960;
    }

    .footer-btn.active {
      background: rgba(88, 166, 255, 0.13);
      border-color: rgba(88, 166, 255, 0.5);
    }

    .btn.primary {
      background: var(--accent);
      color: #0a1929;
      border-color: #6fb4ff;
      box-shadow: 0 10px 20px rgba(88,166,255,0.25);
      font-weight: 600;
    }

    .btn.ghost-danger {
      color: #ffb3b3;
      border-color: #5b2a2a;
      background: rgba(72, 21, 21, 0.3);
    }

    input, select, textarea {
      background: #111722;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-primary);
      font: inherit;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(88,166,255,0.7);
      box-shadow: 0 0 0 3px rgba(88,166,255,0.18);
    }

    .main {
      padding: var(--space-4);
      display: flex;
      align-items: flex-start;
    }

    .panel {
      background: linear-gradient(180deg, #171d26 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.28);
    }

    .compose {
      width: min(980px, 100%);
      margin: 0 auto;
      overflow: hidden;
    }

    .compose-header {
      padding: var(--space-3);
      border-bottom: 1px solid #293751;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .compose-title {
      font-size: 20px;
      font-weight: 700;
    }

    .compose-icon-row {
      display: inline-flex;
      gap: var(--space-2);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #111722;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .compose-body {
      padding: var(--space-3);
      display: grid;
      gap: var(--space-2);
    }

    .field-row {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: var(--space-2);
      align-items: center;
    }

    .field-label {
      color: var(--text-secondary);
      font-size: 14px;
      text-align: right;
      padding-right: 4px;
    }

    .chip-wrap {
      min-height: 44px;
      background: #111722;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
    }

    .chip {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(88,166,255,0.16);
      color: #cae5ff;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-input {
      border: 0;
      background: transparent;
      box-shadow: none;
      min-width: 150px;
      padding: 0;
      width: auto;
      flex: 1;
    }

    .chip-input:focus { box-shadow: none; border-color: transparent; }

    .cc-link {
      color: #58a6ff;
      font-size: 13px;
      cursor: pointer;
    }

    .compose-body textarea {
      min-height: 360px;
      resize: vertical;
    }

    .compose-footer {
      border-top: 1px solid #293751;
      padding: var(--space-3);
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    @media (max-width: 980px) {
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .field-row { grid-template-columns: 1fr; }
      .field-label { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="logo">Cypht</div>
      <nav class="menu-group">
        <a class="menu-item active"><span class="menu-left"><i class="bi bi-inbox"></i>Inbox</span><span class="badge">12</span></a>
        <a class="menu-item"><span class="menu-left"><i class="bi bi-list-task"></i>Everything</span></a>
        <a class="menu-item"><span class="menu-left"><i class="bi bi-envelope"></i>Unread</span><span class="badge">5</span></a>
        <a class="menu-item"><span class="menu-left"><i class="bi bi-star"></i>Flagged</span></a>
        <a class="menu-item"><span class="menu-left"><i class="bi bi-trash3"></i>Trash</span></a>
        <a class="menu-item"><span class="menu-left"><i class="bi bi-pencil-square"></i>Drafts</span><span class="badge muted">2</span></a>
      </nav>
      <div class="section-label">Email Accounts</div>
      <div class="account-block">
        <div class="account-title"><i class="bi bi-caret-down-fill"></i><span class="dot green"></span>user@example.com</div>
        <div class="account-folders">
          <a class="folder-link">Inbox</a><a class="folder-link">Sent</a><a class="folder-link">Drafts</a><a class="folder-link">Archive</a>
        </div>
      </div>
      <div class="account-block">
        <div class="account-title"><i class="bi bi-caret-right-fill"></i><span class="dot gray"></span>work@company.com</div>
      </div>
      <div class="sidebar-footer">
        <button class="footer-btn"><i class="bi bi-gear"></i>Settings</button>
        <button class="footer-btn"><i class="bi bi-box-arrow-right"></i>Logout</button>
      </div>
    </aside>

    <main class="main">
      <section class="panel compose">
        <header class="compose-header">
          <div class="compose-title">New Message</div>
          <div class="compose-icon-row">
            <button class="icon-btn" aria-label="Minimize"><i class="bi bi-dash-lg"></i></button>
            <button class="icon-btn" aria-label="Close"><i class="bi bi-x-lg"></i></button>
          </div>
        </header>

        <div class="compose-body">
          <div class="field-row">
            <div class="field-label">From</div>
            <select>
              <option>user@example.com</option>
              <option>work@company.com</option>
            </select>
            <div></div>
          </div>

          <div class="field-row">
            <div class="field-label">To</div>
            <div class="chip-wrap">
              <span class="chip">john.smith@company.com <i class="bi bi-x"></i></span>
              <span class="chip">sarah.rodriguez@company.com <i class="bi bi-x"></i></span>
              <input class="chip-input" type="text" placeholder="Add recipient">
            </div>
            <span class="cc-link">Cc Bcc</span>
          </div>

          <div class="field-row">
            <div class="field-label">Subject</div>
            <input type="text" value="Re: Q1 Planning Review - Updated Timeline">
            <div></div>
          </div>

          <div class="field-row">
            <div class="field-label" style="align-self:flex-start;padding-top:10px;">Body</div>
            <textarea>Hi John,

Thanks for the updated timeline. The sequencing looks much healthier and gives us enough room for accessibility and QA without compressing release prep.

I agree with moving keyboard shortcuts and threading into Sprint 4, and I also support the two QA gates. Please add owner names for each checkpoint, and include Support in the review invite before Friday.

Once that is in, I am good to sign off.

Best,
Jasmin</textarea>
            <div></div>
          </div>
        </div>

        <footer class="compose-footer">
          <button class="btn primary"><i class="bi bi-send-fill"></i>Send</button>
          <button class="btn"><i class="bi bi-paperclip"></i>Attach</button>
          <button class="btn"><i class="bi bi-floppy"></i>Save Draft</button>
          <button class="btn ghost-danger"><i class="bi bi-trash"></i>Discard</button>
        </footer>
      </section>
    </main>
  </div>
</body>
</html>
